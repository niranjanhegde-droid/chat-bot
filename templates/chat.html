<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { min-height:100vh; background:linear-gradient(135deg,#7c3aed,#06b6d4); }
.chat-box { max-width:900px; margin:auto; border-radius:16px; box-shadow:0 8px 20px rgba(0,0,0,.15); background:rgba(255,255,255,.8); }
[data-bs-theme="dark"] .chat-box { background:rgba(17,17,27,.85); }
.msg { max-width:75%; }
.msg-user { align-self:end; background:#0d6efd; color:#fff; border-radius:12px 12px 0 12px; padding:.5rem .75rem; }
.msg-bot { align-self:start; background:#e5e7eb; border-radius:12px 12px 12px 0; padding:.5rem .75rem; }
[data-bs-theme="dark"] .msg-bot { background:#333; color:#eee; }
</style>
</head>
<body>
<div class="container py-4">
<div class="chat-box d-flex flex-column p-3" style="height:90vh">
<div class="d-flex justify-content-between align-items-center mb-3">
<h5 class="m-0">Chat</h5>
<button class="btn btn-sm btn-outline-secondary" id="themeToggle"><i id="themeIcon" class="bi bi-moon-stars"></i></button>
</div>
<div id="chatMessages" class="flex-grow-1 overflow-auto d-flex flex-column gap-2">
{% for chat in history %}
<div class="msg msg-user">{{ chat.prompt }}</div>
<div class="msg msg-bot">{{ chat.response | safe }}</div>
{% endfor %}
</div>
<form method="POST" class="mt-3">
<div class="input-group">
<input type="text" name="prompt" class="form-control" placeholder="Type a message..." required>
<button class="btn btn-primary" type="submit"><i class="bi bi-send"></i></button>
</div>
</form>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const chatMessages=document.getElementById('chatMessages');chatMessages.scrollTop=chatMessages.scrollHeight;
const preferred=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-bs-theme',preferred);
const themeIcon=document.getElementById('themeIcon');
const setIcon=()=>themeIcon.className=(document.documentElement.getAttribute('data-bs-theme')==='dark')?'bi bi-sun':'bi bi-moon-stars';
setIcon();
document.getElementById('themeToggle').onclick=()=>{const cur=document.documentElement.getAttribute('data-bs-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-bs-theme',next);localStorage.setItem('theme',next);setIcon();};
</script>
</body>
</html>
